[remote.github]
owner = "rabuckley"
repo = "GeminiDotnet"

[changelog]
body = '''
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim }}
    {% for commit in commits %}
        - {% if commit.breaking %}**Breaking:** {% endif -%}
          {{ commit.message | split(pat="\n") | first | trim | upper_first }}
          {%- if commit.remote.pr_number %} #{{ commit.remote.pr_number }}{% endif -%}
          {%- if commit.remote.username %} by @{{ commit.remote.username }}{% endif -%}
    {%- endfor %}
{% endfor %}
{%- set_global new_contributors = [] -%}
{%- for contributor in github.contributors | filter(attribute="is_first_time", value=true) -%}
    {%- if not contributor.username is ending_with("[bot]") -%}
        {%- set_global new_contributors = new_contributors | concat(with=contributor) -%}
    {%- endif -%}
{%- endfor -%}
{% if new_contributors | length > 0 %}
    ### New contributors
    {% for contributor in new_contributors %}
        - @{{ contributor.username }} made their first contribution
          {%- if contributor.pr_number %} in #{{ contributor.pr_number }}{% endif -%}
    {%- endfor %}
{% endif %}
'''
trim = true

[git]
conventional_commits = true
filter_unconventional = false
protect_breaking_commits = true
tag_pattern = "v[0-9].*"
# Squash-merge subjects end in the PR number, which the body now renders itself.
commit_preprocessors = [{ pattern = '(?m) \((\w+\s)?#[0-9]+\)$', replace = "" }]
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^docs", group = "<!-- 3 -->Documentation" },
  { message = "^refactor", group = "<!-- 4 -->Refactoring" },
  { message = "^(chore|ci|build|test|style)", skip = true },
  { message = "^Merge (pull request|branch|remote)", skip = true },
  { message = ".*", group = "<!-- 5 -->Other" },
]

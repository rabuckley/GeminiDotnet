name: Build and Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # MinVer derives the version from the full tag history

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release -- --filter-query "/[Category!=Integration]" --ignore-exit-code 8

      - name: Pack
        run: dotnet pack --no-build --configuration Release --output "${{ runner.temp }}/packages"

      - name: Verify the packed set
        run: |
          version="$(dotnet msbuild src/GeminiDotnet/GeminiDotnet.csproj -t:MinVer -getProperty:PackageVersion)"
          ./eng/verify-release-packages.sh "$version" "${{ runner.temp }}/packages"
